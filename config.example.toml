# Copy this to config.toml, or let `node tools/capture.mjs` generate it filled in.
# The file holds your cookie path and notifier token: chmod 600, and keep it out of git.

[ronspot]
guid = "XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX"  # your CollegesGuID
zone_id = 0                                    # your car park's car_park_id
base_url = "https://my.ronspot.ie"
vehicle_type_id = 2
vehicle_fuel_id = 2

[sniper]
weekdays = [1, 3]      # 0 = Monday. [1, 3] = Tuesday and Thursday
horizon_days = 14      # how far ahead your Ronspot books; measure it with --status
giveup_time = "09:30"  # past this the current day is dropped; "" disables it
local_tz = "Europe/Madrid"   # your clock, for that cut-off
resync_minutes = 30    # how often it re-reads the whole window
confirm_tries = 8      # how many times it asks whether the booking is firm
confirm_gap = 1.5

[notify]
kind = "slack"         # console | slack | discord

[notify.slack]         # bot token with chat:write
token = ""
channel = ""           # the channel ID, e.g. C01AB2CD3EF

[notify.discord]       # Edit channel > Integrations > Webhooks
webhook = ""

[paths]
session = "~/.ronspot/session.json"
state = "~/.ronspot/state.json"
