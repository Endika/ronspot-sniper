[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ronspot-sniper"
version = "0.1.0"
description = "Caza plazas de parking en Ronspot en cuanto alguien libera hueco"
readme = "README.md"
license = "MIT"
keywords = ["ronspot", "parking", "automation", "cron"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-requests"]

[project.scripts]
ronspot-sniper = "ronspot_sniper.__main__:main"

[tool.setuptools]
packages = ["ronspot_sniper", "ronspot_sniper.notify"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["ronspot_sniper", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
