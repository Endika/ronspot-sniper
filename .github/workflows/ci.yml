name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Raspberry Pi runs; the rest so we do not fall behind.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: lint
        run: ruff check --output-format=github .

      - name: format
        run: ruff format --check .

      - name: types
        run: mypy

      - name: tests
        run: pytest -q

  capture-tool:
    name: capture.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: syntax
        run: node --check tools/capture.mjs

  all-green:
    # The only check to require in branch protection: requiring a matrix job by name
    # means adding a Python version silently leaves that one unguarded.
    name: all-green
    if: always()
    needs: [gates, capture-tool]
    runs-on: ubuntu-latest
    steps:
      - name: Check that no gate failed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure')
                 || contains(needs.*.result, 'cancelled')
                 || contains(needs.*.result, 'skipped') }}; then
            echo "::error::a gate did not pass"
            exit 1
          fi
