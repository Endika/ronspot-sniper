name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 es el que corre en la Raspberry Pi; los demás para no quedarnos atrás.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: lint
        run: ruff check --output-format=github .

      - name: formato
        run: ruff format --check .

      - name: tipos
        run: mypy

      - name: tests
        run: pytest -q

  capture-tool:
    name: capture.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: sintaxis
        run: node --check tools/capture.mjs

  all-green:
    # La única comprobación que hay que exigir en la protección de rama: si se exige un
    # job de la matriz por su nombre, añadir una versión de Python lo deja sin exigir.
    name: all-green
    if: always()
    needs: [gates, capture-tool]
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que ninguna puerta falló
        run: |
          echo "resultados: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure')
                 || contains(needs.*.result, 'cancelled')
                 || contains(needs.*.result, 'skipped') }}; then
            echo "::error::alguna puerta no pasó"
            exit 1
          fi
