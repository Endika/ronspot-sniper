name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  deps:
    name: vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install only what the package installs
        # --target instead of a venv: `python -m venv` seeds pip and setuptools, and
        # their vulnerabilities are not the project's. This leaves requests and its own
        # dependencies and nothing else, which is exactly what we want to watch.
        run: pip install --quiet --target .audit .

      - name: pip-audit
        # No --strict on purpose: the package itself is not on PyPI and gets skipped.
        # Real vulnerabilities still exit non-zero.
        run: |
          pip install --quiet pip-audit
          pip-audit --desc --path .audit
