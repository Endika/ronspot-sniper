name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  deps:
    name: dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar solo lo que instala el paquete
        # --target y no un venv: `python -m venv` siembra pip y setuptools, y sus
        # vulnerabilidades no son las del proyecto. Aquí caen requests y sus dependencias
        # y nada más, que es justo lo que queremos vigilar.
        run: pip install --quiet --target .audit .

      - name: pip-audit
        # Sin --strict a propósito: el propio paquete no está en PyPI y se salta. Las
        # vulnerabilidades reales siguen devolviendo código distinto de cero.
        run: |
          pip install --quiet pip-audit
          pip-audit --desc --path .audit
