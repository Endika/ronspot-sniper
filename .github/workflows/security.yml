name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  deps:
    name: dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar solo lo que instala el paquete
        # En un venv aparte: auditar el entorno del runner mezcla las vulnerabilidades de
        # pip y del propio tooling con las del proyecto, y eso es ruido, no señal.
        run: |
          python -m venv .audit
          .audit/bin/pip install --quiet --upgrade pip
          .audit/bin/pip install --quiet .

      - name: pip-audit
        # Sin --strict a propósito: el propio paquete no está en PyPI y se salta. Las
        # vulnerabilidades reales siguen devolviendo código distinto de cero.
        run: |
          pip install --quiet pip-audit
          pip-audit --desc --path .audit/lib/python3.11/site-packages
